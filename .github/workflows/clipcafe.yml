name: Extraits Clip.cafe

# Recupere les extraits d'un segment et les rend en zip telechargeable.
# Se lance a la main depuis l'onglet Actions.
#
# Prerequis : ajouter la cle Clip.cafe dans
# Settings > Secrets and variables > Actions > New repository secret
#   Nom    : CLIP_CAFE_API_KEY
#   Valeur : ta cle

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "catalogue = liste les extraits du film | posters = recupere les affiches des 9 films | search = cherche plan par plan | complet = telecharge selon assign.json"
        required: true
        default: catalogue
        type: choice
        options: [catalogue, posters, search, complet]

jobs:
  extraits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mr-tier-maker/episode-01-transformers/scripts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Les runners ubuntu-latest ne fournissent pas ffmpeg. L'installation ne sert
      # qu'au decoupage, donc on l'evite dans les modes catalogue et search.
      # DEBIAN_FRONTEND et NEEDRESTART_MODE evitent les invites interactives, qui ont
      # deja fait rester un run bloque sept minutes sur cette etape.
      - name: Installer ffmpeg
        if: inputs.phase == 'complet'
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          NEEDRESTART_SUSPEND: 1
        timeout-minutes: 5
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      # Echoue tout de suite avec un message clair plutot qu'au milieu de la serie.
      - name: Verifier le secret
        env:
          CLIP_CAFE_API_KEY: ${{ secrets.CLIP_CAFE_API_KEY }}
        run: |
          if [ -z "$CLIP_CAFE_API_KEY" ]; then
            echo "::error::Le secret CLIP_CAFE_API_KEY n'est pas defini. Va dans Settings > Secrets and variables > Actions > New repository secret, nomme-le CLIP_CAFE_API_KEY."
            exit 1
          fi
          echo "Secret present : ${#CLIP_CAFE_API_KEY} caracteres."

      # Tourne aussi en mode complet : le runner est vierge a chaque fois, et
      # fetch a besoin du catalogue a jour pour resoudre les slugs de assign.json.
      - name: Lister le catalogue du film
        if: inputs.phase == 'catalogue' || inputs.phase == 'complet'
        env:
          CLIP_CAFE_API_KEY: ${{ secrets.CLIP_CAFE_API_KEY }}
        run: node clipcafe-film1.mjs catalogue

      - name: Recuperer les affiches des films
        if: inputs.phase == 'posters'
        env:
          CLIP_CAFE_API_KEY: ${{ secrets.CLIP_CAFE_API_KEY }}
        run: node clipcafe-film1.mjs posters

      - name: Publier les affiches
        if: inputs.phase == 'posters'
        uses: actions/upload-artifact@v4
        with:
          name: affiches-films
          path: |
            mr-tier-maker/episode-01-transformers/scripts/posters/
            mr-tier-maker/episode-01-transformers/scripts/posters.json
          if-no-files-found: error
          retention-days: 7

      - name: Rechercher les extraits
        if: inputs.phase == 'search'
        env:
          CLIP_CAFE_API_KEY: ${{ secrets.CLIP_CAFE_API_KEY }}
        run: node clipcafe-film1.mjs search

      - name: Verifier assign.json
        if: inputs.phase == 'complet'
        run: |
          if [ ! -f assign.json ]; then
            echo "::error::assign.json est absent. Lance d'abord le mode catalogue, fais assigner les extraits aux plans, puis commite assign.json a cote du script. Sans ce fichier, fetch telechargerait plusieurs fois le meme extrait."
            exit 1
          fi
          echo "assign.json present : $(grep -c ':' assign.json) plans assignes."

      - name: Telecharger et couper
        if: inputs.phase == 'complet'
        env:
          CLIP_CAFE_API_KEY: ${{ secrets.CLIP_CAFE_API_KEY }}
        run: node clipcafe-film1.mjs fetch

      # choices.json d'abord : meme si le telechargement echoue, tu vois ce que
      # l'API a trouve et tu peux corriger picks.json avant de relancer.
      - name: Publier les resultats de recherche
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipcafe-catalogue
          path: |
            mr-tier-maker/episode-01-transformers/scripts/catalogue.json
            mr-tier-maker/episode-01-transformers/scripts/choices.json
            mr-tier-maker/episode-01-transformers/scripts/picks.json
          if-no-files-found: warn

      - name: Publier les extraits
        if: inputs.phase == 'complet'
        uses: actions/upload-artifact@v4
        with:
          name: extraits-film1-1986
          path: |
            mr-tier-maker/episode-01-transformers/scripts/clips-film1/
            mr-tier-maker/episode-01-transformers/scripts/manifest-film1.json
          if-no-files-found: error
          retention-days: 7
