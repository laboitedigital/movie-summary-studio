name: Extraits de tout un episode

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Chemin du plan de montage"
        required: true
        default: "mr-tier-maker/episode-01-transformers/plan-episode-01.json"
      segment:
        description: "Numero de segment (0 = 1986, 8 = Rise of the Beasts). Vide = tous les films"
        required: false
        default: ""
      plans:
        description: "Numeros de plan precis, separes par des virgules. Prioritaire sur le segment"
        required: false
        default: ""
      exclure:
        description: "Slugs deja utilises pour ce film, a ne pas reprendre. Obligatoire avec plans"
        required: false
        default: ""
      requete:
        description: "Remplace la requete du plan. Plusieurs, separees par |, essayees a la suite"
        required: false
        default: ""
      planche:
        description: "Deposer une planche de controle des extraits sur la branche (true / false)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  extraits:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verifier la cle
        run: |
          if [ -z "${{ secrets.CLIP_CAFE_API_KEY }}" ]; then
            echo "Le secret CLIP_CAFE_API_KEY est absent."
            echo "Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

      - name: Installer ffmpeg
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Telecharger les extraits
        working-directory: mr-tier-maker/episode-01-transformers/scripts
        env:
          CLIP_CAFE_API_KEY: ${{ secrets.CLIP_CAFE_API_KEY }}
          PLAN: ${{ inputs.plan }}
          SEG: ${{ inputs.segment }}
          PLANS: ${{ inputs.plans }}
          EXCLURE: ${{ inputs.exclure }}
          REQUETE: ${{ inputs.requete }}
        run: |
          set -e
          # le plan est reference depuis la racine du depot
          node clipcafe-episode.mjs "$GITHUB_WORKSPACE/$PLAN" $SEG

      - uses: actions/upload-artifact@v4
        with:
          name: extraits
          path: mr-tier-maker/episode-01-transformers/scripts/clips/
          retention-days: 7

      # Les artefacts ne sont pas telechargeables depuis la session : sans ca,
      # le seul moyen de VOIR ce que Clip.cafe a rendu etait de relancer un
      # montage complet, 85 minutes, pour decouvrir qu un extrait est hors
      # sujet. La planche coute quelques secondes et se lit tout de suite.
      - name: Planche de controle
        if: ${{ inputs.planche == 'true' }}
        working-directory: mr-tier-maker/episode-01-transformers
        run: |
          set -e
          rm -rf planche && mkdir -p planche/f apercu
          legende="| ligne | plan | duree |"
          legende="$legende\n|---|---|---|"
          i=0
          for c in $(ls scripts/clips/*.mp4 | sort); do
            n=$(basename "$c" .mp4)
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$c")
            i=$((i+1))
            for q in 20 50 80; do
              t=$(awk -v d="$d" -v q="$q" 'BEGIN{printf "%.3f", d*q/100}')
              ffmpeg -y -loglevel error -ss "$t" -i "$c" -frames:v 1 \
                -vf "scale=480:270:force_original_aspect_ratio=decrease,pad=480:270:-1:-1:black" \
                "planche/f/$(printf '%03d' $i)-$n-$q.png"
            done
            legende="$legende\n| $i | $n | ${d}s |"
          done
          # tile assemble dans l ordre alphabetique des fichiers : une ligne par
          # extrait, les trois instants dans l ordre. Six extraits par planche —
          # au-dela l image devient trop haute pour se lire d un coup.
          rm -f apercu/planche-extraits-*.jpg
          ffmpeg -y -loglevel error -pattern_type glob -i 'planche/f/*.png' \
            -vf "tile=3x6:margin=6:padding=4:color=0x101018" \
            apercu/planche-extraits-%02d.jpg
          printf "%b\n" "$legende" > apercu/planche-extraits.md
          rm -rf planche
          ls -la apercu/

      - name: Deposer la planche sur la branche
        if: ${{ inputs.planche == 'true' }}
        run: |
          set -e
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add mr-tier-maker/episode-01-transformers/apercu/planche-extraits-*.jpg \
                  mr-tier-maker/episode-01-transformers/apercu/planche-extraits.md
          git commit -m "Planche de controle des extraits (run ${{ github.run_id }})" || exit 0
          git push origin HEAD:${{ github.ref_name }}
